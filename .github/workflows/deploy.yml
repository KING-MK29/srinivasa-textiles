name: Deploy Srinivasa Textiles Production

on:
  push:
    branches: [ main, master ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Registry
      if: env.DOCKER_USERNAME != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ env.DOCKER_USERNAME != '' }}
        tags: |
          ${{ env.DOCKER_USERNAME != '' && format('{0}/srinivasa-textiles-api:latest', secrets.DOCKER_USERNAME) || 'srinivasa-textiles/api:latest' }}

    - name: Trigger Render Deploy Hook
      if: env.RENDER_DEPLOY_HOOK_URL != ''
      run: |
        curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" || echo "Render deploy hook trigger failed"

